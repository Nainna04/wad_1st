<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abubarkar | Home</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #1f3a5f;
        --secondary: #4b7bec;
        --text: #1d1d1f;
        --muted: #5d6778;
        --border: #dfe7f1;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef3fb, #f9fbff);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .card {
        width: min(90vw, 760px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 18px 45px rgba(31, 58, 95, 0.12);
        padding: 42px 32px;
      }

      .tag {
        display: inline-block;
        font-size: 0.76rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--secondary);
        font-weight: 700;
      }

      h1 {
        margin: 16px 0 10px;
        font-size: clamp(2.2rem, 4vw, 3.4rem);
        color: var(--primary);
      }

      p {
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .details {
        margin-top: 26px;
        display: grid;
        gap: 12px;
      }

      .row {
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #f9fbff;
      }

      .row strong {
        color: var(--primary);
      }

      .actions {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .btn {
        text-decoration: none;
        padding: 12px 18px;
        border-radius: 10px;
        font-weight: 700;
        transition: 0.2s ease;
      }

      .btn.primary {
        background: var(--secondary);
        color: white;
      }

      .btn.secondary {
        background: transparent;
        color: var(--primary);
        border: 1px solid var(--border);
      }

      .btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="tag">Welcome</div>
      <h1>Abubarkar</h1>
      <p>
        I’m a student and web developer focused on building clean, modern, and user-friendly digital experiences.
      </p>

      <div class="details">
        <div class="row"><strong>Phone:</strong> 1234567</div>
        <div class="row"><strong>Email:</strong> a.d.c@salford.ac.uk</div>
        <div class="row"><strong>Address:</strong> University of Salford, The Crescent, Salford, Greater Manchester, M5 4WT, United Kingdom</div>
      </div>

      <div class="actions">
        <a class="btn primary" href="contact.html">Contact Me</a>
        <a class="btn secondary" href="mailto:a.d.c@salford.ac.uk">Email Me</a>
      </div>
    </main>
  </body>
</html>
